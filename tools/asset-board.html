*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--ui);line-height:1.55;margin:0}
.wrap{max-width:660px;margin:0 auto;padding-inline:14px;padding-block:20px 72px;

h1{font-family:var(--story);font-weight:700;font-size:24px;margin:0;text-wrap:balance}
.flow{font-size:13px;color:var(--muted);margin:0}

.msg{background:var(--surface);border:1px solid var(--line);border-radius:12px;

  display:flex;flex-direction:column}
.msg.done{border-color:var(--done)}

.hdr{display:flex;align-items:center;gap:12px;padding:14px 15px 12px}
.mark{flex:none;font-family:var(--story);font-weight:700;font-size:30px;line-height:1;

.cnt{flex:none;font:500 12px var(--mono);font-variant-numeric:tabular-nums;
  color:var(--muted);background:var(--sunk);border-radius:999px;padding:4px 10px;white-space:nowrap}
.msg.done .cnt{background:var(--done-soft);color:var(--done)}

.desc{font-size:13.5px;margin:0;padding:0 15px 12px}
.desc b{font-weight:600}

.acts{display:flex;gap:7px;padding:0 15px 13px}
.btn{font:500 13px var(--ui);border:1px solid var(--line);background:var(--sunk);
  color:var(--ink);padding:10px 14px;border-radius:9px;cursor:pointer;min-height:42px}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#FFFDF7;flex:1}
.btn.ok{background:var(--done-soft);border-color:var(--done);color:var(--done)}

pre{margin:0;padding:12px 15px;background:var(--sunk);

  font:400 11px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;

.grp{border-top:1px solid var(--line);padding:11px 15px 13px}
.grp.files{background:var(--sunk)}
.grp h3{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted);

.grp ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}

.f{display:flex;align-items:center;gap:9px;width:100%;text-align:left;

.f:hover{background:var(--gold-soft)}
.box{flex:none;width:22px;height:22px;border:2px solid var(--line);border-radius:6px;

.f[aria-pressed="true"] .box{background:var(--done-soft);border-color:var(--done);color:var(--done)}
.f[aria-pressed="true"] .nm{text-decoration:line-through;color:var(--muted)}
.pth{color:var(--muted);font-size:11px}
.nm{font-weight:500;word-break:break-all}
.ref{margin-left:auto;flex:none;font:600 10px var(--ui);letter-spacing:.02em;

.grp.qc li::before{content:"□";color:var(--muted);font-size:12px;flex:none}
.grp.qc b{font-weight:600}

.end{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);

.end code{font:400 12px var(--mono);background:var(--sunk);padding:2px 6px;border-radius:5px}
a{color:var(--gold)}

const FILES = M.flatMap(m => m.files);
let done = new Set(), db = null;

const split = p => { const i = p.lastIndexOf('/'); return [p.slice(0, i + 1), p.slice(i + 1)]; };
// 같은 폴더가 줄마다 반복되면 파일명이 안 보인다. 폴더는 머리에 한 번만 쓴다.
const common = fs => {
  const n = {};
  for(const f of fs){ const d = split(f)[0]; n[d] = (n[d] || 0) + 1; }
  return Object.keys(n).sort((a, b) => n[b] - n[a])[0];
};

async function copy(text, btn){
  let ok = false;
  try{ await navigator.clipboard.writeText(text); ok = true; }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;left:-9999px';
    document.body.appendChild(ta); ta.select();
    try{ ok = document.execCommand('copy'); }catch(e2){}
    ta.remove();
  }
  btn.textContent = ok ? '복사됐어요' : '길게 눌러 복사';
  btn.classList.toggle('ok', ok);
  setTimeout(() => { btn.textContent = '프롬프트 복사'; btn.classList.remove('ok'); }, 1500);
}

function refresh(){
  const n = FILES.filter(f => done.has(f)).length;
  document.getElementById('pn').textContent = `${n} / ${FILES.length}`;
  document.getElementById('pb').style.width = (n / FILES.length * 100) + '%';
  document.getElementById('pt').textContent =
    n === FILES.length ? '끝났습니다' : n ? `${FILES.length - n}장 남음` : '';
  M.forEach((m, i) => {
    const card = document.getElementById('m' + i);
    const k = m.files.filter(f => done.has(f)).length;
    card.classList.toggle('done', k === m.files.length);
    card.querySelector('.cnt').textContent =
      k === 0 ? `${m.files.length}장` : `${k} / ${m.files.length}장`;
    for(const f of m.files){
      const b = document.getElementById('f' + FILES.indexOf(f));
      b.setAttribute('aria-pressed', done.has(f));
    }
  });
}
async function toggle(f){
  done.has(f) ? done.delete(f) : done.add(f);
  refresh();
  try{ localStorage.setItem('goldaxe_files', JSON.stringify([...done])); }catch(e){}
  if(db){ try{ await db.doc('assets/files').set({ done: [...done] }); }catch(e){} }
}

const list = document.getElementById('list');
M.forEach((m, i) => {
  const dir = common(m.files);
  const card = document.createElement('article');
  card.className = 'msg'; card.id = 'm' + i;
  card.innerHTML = `
    <div class="hdr">
      <span class="mark" aria-hidden="true">${m.mark}</span>
      <div class="ttl"><h2>${m.title}</h2>${m.sub ? `<p class="sub">${m.sub}</p>` : ''}</div>
      <span class="cnt">${m.files.length}장</span>
    </div>
    <p class="desc">${m.desc}</p>
    <div class="acts">
      <button class="btn pri js-copy">프롬프트 복사</button>
      <button class="btn js-show">보기</button>
    </div>
    <pre hidden></pre>
    <div class="grp files"><h3>나오는 파일 <code>${dir}</code></h3><ul>${m.files.map(f => {
      const [p, n] = split(f), k = FILES.indexOf(f);
      return `<li><button class="f" id="f${k}" aria-pressed="false">
        <span class="box" aria-hidden="true">✓</span>
        <span>${p === dir ? '' : `<span class="pth">${p}</span>`}<span class="nm">${n}</span></span>
        ${p.startsWith('style/refs') ? '<span class="ref">기준</span>' : ''}
      </button></li>`;
    }).join('')}</ul></div>
    <div class="grp qc"><h3>확인할 것</h3>
      <ul>${m.qc.map(t => `<li>${t}</li>`).join('')}</ul></div>`;
  const pre = card.querySelector('pre'); pre.textContent = m.p;
  card.querySelector('.js-copy').onclick = e => copy(m.p, e.currentTarget);
  card.querySelector('.js-show').onclick = e => {
    pre.hidden = !pre.hidden;
    e.currentTarget.textContent = pre.hidden ? '보기' : '접기';
  };
  for(const f of m.files) card.querySelector('#f' + FILES.indexOf(f)).onclick = () => toggle(f);
  list.appendChild(card);
});

try{
  done = new Set(JSON.parse(localStorage.getItem('goldaxe_files') || '[]'));
  if(!done.size){  // 이름만 체크하던 예전 판에서 넘어오기
    const old = JSON.parse(localStorage.getItem('goldaxe_assets') || '[]');
    for(const id of old){
      const hit = FILES.find(f => split(f)[1] === id + '.png');
      if(hit) done.add(hit);
    }
  }
}catch(e){}
refresh();

(async () => {
  const s = document.getElementById('sync');
  try{ db = await window.claude?.use?.('db') ?? null; }catch(e){}
  if(!db){ s.textContent = '이 기기에만'; return; }
  db.doc('assets/files').onSnapshot(snap => {
    const arr = (snap.exists && snap.data()?.done) || [];
    done = new Set([...done, ...arr]); refresh(); s.textContent = '☁ 저장됨';
  }, () => { s.textContent = '이 기기에만'; });
})();
</script>
