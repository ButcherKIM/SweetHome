<title>금도끼 에셋 작업판</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#F3ECDD; --surface:#FFFDF7; --sunk:#EDE4D0;
  --ink:#2C2A24; --muted:#7A7466; --line:#DFD6C1;
  --gold:#A67C2E; --gold-soft:#F4E8CA;
  --sage:#6F7F5D; --sage-soft:#E4EADB;
  --done:#4F6B47; --done-soft:#DFE9DA;
  --magenta:#B03C8E; --magenta-soft:#F7E2F0;
  --black:#3A3A3A; --black-soft:#E2E0DC;
  --shadow:0 1px 2px rgba(44,42,36,.05), 0 5px 16px rgba(44,42,36,.05);
  --ui:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono","IBM Plex Sans KR",ui-monospace,monospace;
  --story:"Gowun Batang","IBM Plex Sans KR",serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#191D19; --surface:#222722; --sunk:#141814;
  --ink:#E9E3D4; --muted:#9A9583; --line:#333A32;
  --gold:#D9B455; --gold-soft:#312814;
  --sage:#9BAE86; --sage-soft:#232B20;
  --done:#8FB683; --done-soft:#1E2A1C;
  --magenta:#E58BC8; --magenta-soft:#301E2A;
  --black:#B9B6AE; --black-soft:#26251F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 5px 16px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --ground:#191D19; --surface:#222722; --sunk:#141814;
  --ink:#E9E3D4; --muted:#9A9583; --line:#333A32;
  --gold:#D9B455; --gold-soft:#312814;
  --sage:#9BAE86; --sage-soft:#232B20;
  --done:#8FB683; --done-soft:#1E2A1C;
  --magenta:#E58BC8; --magenta-soft:#301E2A;
  --black:#B9B6AE; --black-soft:#26251F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 5px 16px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--ui);line-height:1.55;margin:0}
.wrap{max-width:680px;margin:0 auto;padding-inline:14px;padding-block:18px 64px;
  display:flex;flex-direction:column;gap:14px}

h1{font-family:var(--story);font-size:23px;margin:0}
.flow{font-size:13px;color:var(--muted);margin:0}
.flow b{color:var(--ink);font-weight:600}

.prog{position:sticky;top:0;z-index:20;background:var(--ground);
  padding-block:9px;border-bottom:1px solid var(--line)}
.prog .row{display:flex;align-items:baseline;gap:9px;margin-bottom:6px}
.prog .n{font:700 19px/1 var(--mono);color:var(--gold);font-variant-numeric:tabular-nums}
.prog .t{font-size:12.5px;color:var(--muted)}
.prog .sync{margin-left:auto;font:400 11px var(--mono);color:var(--muted)}
.bar{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}

.shead{font-size:13px;font-weight:600;color:var(--muted);padding-inline:2px;margin-top:6px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;
  box-shadow:var(--shadow);overflow:hidden}
.card.ing{border-style:dashed;border-color:var(--sage)}
.card.done{opacity:.45}
.card.done .name{text-decoration:line-through}
.top{display:flex;align-items:flex-start;gap:10px;padding:12px 13px 10px}
.chk{flex:none;width:28px;height:28px;border:2px solid var(--line);border-radius:8px;
  background:var(--sunk);cursor:pointer;display:grid;place-items:center;padding:0;
  font-size:16px;line-height:1;color:transparent;transition:all .15s}
.chk[aria-pressed="true"]{background:var(--done-soft);border-color:var(--done);color:var(--done)}
.chk.static{cursor:default;background:var(--done-soft);border-color:var(--done);color:var(--done)}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.name{font:500 13px/1.35 var(--mono);word-break:break-all}
.desc{font-size:13.5px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.tag{font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:2.5px 8px;border-radius:999px;
  background:var(--sage-soft);color:var(--sage);white-space:nowrap}
.tag.m{background:var(--magenta-soft);color:var(--magenta)}
.tag.k{background:var(--black-soft);color:var(--black)}
.tag.d{background:var(--done-soft);color:var(--done)}

.acts{display:flex;gap:7px;padding:0 13px 11px}
.btn{font:500 12.5px var(--ui);border:1px solid var(--line);background:var(--sunk);
  color:var(--ink);padding:9px 14px;border-radius:9px;cursor:pointer;min-height:40px}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#fff;flex:1}
.btn.ok{background:var(--done-soft);border-color:var(--done);color:var(--done)}

.qc{margin:0;padding:9px 13px 11px;border-top:1px solid var(--line);background:var(--sunk);
  font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.qc li{list-style:none;display:flex;gap:7px;align-items:baseline}
.qc li::before{content:"□";color:var(--muted);font-size:12px;flex:none}
.qc b{font-weight:600}

pre{margin:0;padding:11px 13px;background:var(--sunk);border-top:1px solid var(--line);
  font:400 11px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;
  max-height:300px;overflow:auto}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>

<div class="wrap">
  <h1>금도끼 에셋 작업판</h1>
  <p class="flow"><b>복사</b> → Flow에 붙여넣기 → <b>□ 확인</b> → 다운로드 →
    <a href="https://claude.ai/code/artifact/76043b70-8fe7-4d9d-a872-c97960e217e6"
       target="_blank" rel="noopener">플레이어</a>의 같은 이름 칸에 넣기 → <b>체크</b></p>
  <p class="flow"><b>한 장에 3개</b>인 카드는 — 같은 파일을 <b>세 칸에 각각</b> 넣으면
    매번 “몇 번째를 쓸까요” 를 물어봅니다. 왼쪽부터 1·2·3번입니다.</p>

  <div class="prog">
    <div class="row"><span class="n" id="pn">0 / 19</span>
      <span class="t" id="pt"></span><span class="sync" id="sync"></span></div>
    <div class="bar"><i id="pb"></i></div>
  </div>

  <div id="list"></div>
</div>

<script>
const TOKEN = `Korean folk tale picture-book illustration, hanji paper watercolor with visible paper grain,
soft brush ink outlines, muted earth palette of sage green, clay ochre and warm grey,
flat even daylight with no harsh shadows, characters 2.5 heads tall with rounded
simplified forms and small gentle features, hand-painted children's book art,
completely static image, single still frame, no camera movement, no motion, no animation,
no text, no lettering, no watermark, no signature`;
const MAG = `Isolated on a plain flat magenta #FF00FF background.
No shadow, no ground, no cast shadow, no floor line, no other objects.`;
const KEEP = `Keep this exact character design, same face, same clothes, same colors.`;
const BGR = `IMPORTANT STYLE RULES:
Very simple and flat: only three depth layers, large simple shapes, minimal detail.
Use the SAME thick soft ink outline weight as a children's picture book character.
The background must stay quiet and recede so a character placed in front of it stands out.
Leave the lower middle area open and uncluttered.
Horizon in the lower third, shallow flat perspective like a picture book page.

ABSOLUTELY NO people, NO characters, NO animals, NO human figures anywhere.
Very wide panoramic composition, aspect ratio 21:9.`;

const ch = (pose, dir) => `${TOKEN}\n\nFull body single character, ${pose}\nFacing slightly to the ${dir}, three-quarter view turned toward the ${dir.toLowerCase()} side of the frame.\n${MAG}\n${KEEP}`;
const bgp = (scene, extra) => `${TOKEN}\n\nA wide establishing shot of ${scene}\n\n${extra}${BGR}`;
const pr = (o) => `${TOKEN}\n\n${o}, single object, centered, seen from the side.\nIsolated on a plain flat magenta #FF00FF background.\nNo shadow, no ground, no cast shadow, no hands, no other objects.`;
const ic = (a) => `${TOKEN}\n\n${a} Simple clear composition, single focus, large and easy to read at a glance.\nIsolated on a plain flat magenta #FF00FF background.\nNo shadow, no ground, no text.`;

const QC_CHAR = ["밑그림과 <b>같은 사람</b>인가", "발밑에 <b>그림자·바닥선</b>이 없는가", "손발이 잘리지 않았는가"];
const QC_BG   = ["<b>사람이 없는가</b>", "가로로 충분히 긴가", "하단 가운데가 비었는가"];
const QC_PROP = ["분홍 배경이 얼룩 없이 고른가", "그림자·손이 없는가"];
const QC_ICON = ["<b>글자 없이</b> 뭔지 알아보겠는가", "분홍 배경이 고른가"];

const G = [
 { kind:"ing", title:"재료 — Flow에 첨부용 (앱에 안 들어감)", items:[
   { id:"sheet_w", name:"나무꾼 밑그림", desc:"이미 갖고 계신 것", fixed:true, nonum:true,
     tags:[["d","완료"],["","1·2·3번에 첨부"]],
     p:`${TOKEN}\n\nCharacter reference sheet of a kind young Korean woodcutter in his early twenties.\nHe wears a simple undyed hemp jeogori jacket and baji trousers with a dark cloth waist sash,\nstraw shoes, and his hair tied in a small topknot with a plain headband.\nShow the SAME character three times side by side in one image:\nfull-body front view, full-body side view, and a head close-up with a neutral expression.\nRelaxed standing pose, arms at his sides.\n${MAG}` },
   { id:"sheet_s", name:"산신령 밑그림", desc:"흰 수염 · 옅은 도포 · 지팡이 · 세 장면", nonum:true,
     tags:[["m","분홍 배경"],["","첨부 없이"],["","4·5번에 쓸 것"]],
     p:`${TOKEN}\n\nCharacter reference sheet of a gentle Korean mountain spirit (sanshin): an elderly sage\nwith a long flowing white beard and long white eyebrows, wearing loose pale robes\nwith soft golden trim, holding a simple wooden staff, a faint warm glow around him,\nkind smiling eyes. He floats slightly rather than standing on the ground.\nShow the SAME character three times side by side in one image:\nfull-body front view, full-body three-quarter view, and a head close-up.\n${MAG}`,
     qc:["세 장면의 <b>수염·옷·지팡이가 같은가</b>", "분홍 배경이 고른가", "<b>저장했는가</b> (4·5번에 씁니다)"] },
 ]},
 { title:"캐릭터", items:[
   { id:"char_woodcutter_idle", name:"char_woodcutter_idle", desc:"도끼를 어깨에 메고 편안히",
     tags:[["m","분홍 배경"],["","나무꾼 밑그림 첨부"],["","오른쪽을 봄"]], qc:QC_CHAR,
     p: ch("standing calmly holding an axe over his shoulder, faint friendly smile.","RIGHT") },
   { id:"char_woodcutter_sad", name:"char_woodcutter_sad", desc:"어깨가 처지고 빈손, 근심",
     tags:[["m","분홍 배경"],["","나무꾼 밑그림 첨부"],["","오른쪽을 봄"]], qc:QC_CHAR,
     p: ch("shoulders drooped, both hands empty and open, looking down, worried face.","RIGHT") },
   { id:"char_woodcutter_happy", name:"char_woodcutter_happy", desc:"두 팔 들고 활짝",
     tags:[["m","분홍 배경"],["","나무꾼 밑그림 첨부"],["","오른쪽을 봄"]], qc:QC_CHAR,
     p: ch("both arms raised in delight, big open smile, standing upright.","RIGHT") },
   { id:"char_spirit_calm", name:"char_spirit_calm", desc:"금도끼를 내밀며 잔잔하게",
     tags:[["m","분홍 배경"],["","산신령 밑그림 첨부"],["","왼쪽을 봄"]], qc:QC_CHAR,
     p: ch("floating upright, one hand holding a golden axe out toward the viewer, serene expression.","LEFT") },
   { id:"char_spirit_smile", name:"char_spirit_smile", desc:"두 팔 벌려 건네주는 미소",
     tags:[["m","분홍 배경"],["","산신령 밑그림 첨부"],["","왼쪽을 봄"]], qc:QC_CHAR,
     p: ch("floating upright, both arms open in a giving gesture, warm smile.","LEFT") },
 ]},
 { title:"배경", items:[
   { id:"bg_forest_day", name:"bg_forest_day", desc:"아침 숲길 — 소나무, 이끼 바위",
     tags:[["","배경 그대로"],["","21:9"]], qc:QC_BG,
     p: bgp("a quiet Korean mountain forest path in soft morning light,\ntall pine trees, mossy rocks, ferns along the path, a distant ridge.",
            "Bright and airy with light high-key values. Do NOT make it dark, moody or atmospheric.\n") },
   { id:"bg_pond_day", name:"bg_pond_day", desc:"평범한 연못 — 빛나기 전",
     tags:[["","배경 그대로"],["","21:9"],["","빛나는 연못 첨부하면 좋음"]],
     qc:[...QC_BG, "빛·안개·반짝임이 <b>없는가</b>"],
     p: bgp("a small still forest pond in a Korean mountain valley,\npine trees and mossy rocks around the water, a calm reflective surface.",
            "Plain quiet overcast daylight, unremarkable. No golden glow, no light rays, no mist.\nBright and airy, NOT dark or moody.\n") },
   { id:"bg_home_night", name:"bg_home_night", desc:"초가집, 밤 — 창에 등불",
     tags:[["","배경 그대로"],["","21:9"]],
     qc:[...QC_BG, "<b>무섭지 않은가</b> (등불이 따뜻한 밤)"],
     p: bgp("a small humble Korean thatched-roof cottage at night,\nwarm lamplight glowing softly through the paper window, a low stone wall,\na persimmon tree beside the gate, a quiet night sky with a few stars.",
            "Gentle and calm, NOT dark or scary. Soft blue-grey night tones with warm lamplight.\n") },
 ]},
 { title:"소품", items:[
   { id:"axes3", name:"도끼 3자루 — 한 장에", desc:"왼쪽부터 쇠 · 금 · 은",
     tags:[["m","분홍 배경"],["","3개 칸에 나눠 넣기"]],
     qc:["세 자루가 <b>서로 안 닿는가</b> (닿으면 한 덩어리가 됩니다)",
         "<b>왼쪽부터 쇠·금·은</b> 순서가 맞는가",
         "셋이 같은 크기·같은 그림체인가"],
     p:`${TOKEN}

Three different axes side by side in a row, evenly spaced with clear wide gaps between them,
NOT touching each other. From left to right:
1) a plain old iron axe with a worn wooden handle,
2) a shining golden axe with an ornate handle and a soft warm glow,
3) a shining silver axe with a pale handle and a soft cool glow.
All three seen from the side, the same size, the same style.
Isolated on a plain flat magenta #FF00FF background.
No shadow, no ground, no cast shadow, no hands, no other objects, no text.` },
   { id:"prop_light_rays", name:"prop_light_rays", desc:"연못에서 솟는 황금빛",
     tags:[["k","⚠ 검정 배경"]],
     qc:["배경이 <b>완전한 검정</b>인가 (회색빛 금지)", "빛 말고 <b>다른 게 없는가</b>"],
     p:`Hand-painted watercolor soft golden light rays fanning upward and outward from a point
near the bottom, with gentle glowing haze, fading out smoothly toward the edges.
Warm golden tone.

Pure solid BLACK background (#000000). Absolutely nothing else in the image —
no scenery, no objects, no characters, no ground, no border, no text.
Only the glow itself on pure black.
Completely static image, single still frame, no motion.
Aspect ratio 16:9.` },
 ]},
 { title:"선택지 그림", items:[
   { id:"choice1", name:"첫 번째 선택 3개 — 한 장에", desc:"왼쪽부터 물에 들어감 · 앉아 기다림 · 집",
     tags:[["m","분홍 배경"],["","3개 칸에 나눠 넣기"]],
     qc:["셋이 <b>서로 안 닿는가</b>",
         "<b>글자 없이</b> 각각 뭔지 알아보겠는가",
         "왼쪽부터 <b>물 · 앉음 · 집</b> 순서가 맞는가"],
     p:`${TOKEN}

Three simple icon-like illustrations side by side in a row, evenly spaced with clear wide gaps,
NOT touching each other. From left to right:
1) a pair of bare feet stepping into shallow pond water, with ripples spreading,
2) a person sitting cross-legged beside water, seen from behind, waiting quietly,
3) a small thatched-roof cottage with a warm glowing window, seen from a distance.
Each one simple and clear, single focus, easy to read at a glance, all the same size.
Isolated on a plain flat magenta #FF00FF background.
No shadow, no ground, no text.` },
   { id:"choice2", name:"두 번째 선택 3개 — 한 장에", desc:"왼쪽부터 쇠도끼 가리킴 · 금도끼 잡음 · 모르겠다",
     tags:[["m","분홍 배경"],["","3개 칸에 나눠 넣기"]],
     qc:["셋이 <b>서로 안 닿는가</b>",
         "<b>글자 없이</b> 각각 뭔지 알아보겠는가",
         "왼쪽부터 <b>가리킴 · 잡음 · 모르겠다</b> 순서가 맞는가"],
     p:`${TOKEN}

Three simple icon-like illustrations side by side in a row, evenly spaced with clear wide gaps,
NOT touching each other. From left to right:
1) a hand pointing at a plain old iron axe,
2) a hand reaching out to grab a shining golden axe,
3) two open empty hands raised in an "I don't know" gesture.
Each one simple and clear, single focus, easy to read at a glance, all the same size.
Isolated on a plain flat magenta #FF00FF background.
No shadow, no ground, no text.` },
 ]},
];

const ALL = G.flatMap(g => g.items).filter(a => !a.fixed);
let done = new Set(), db = null;

async function copy(text, btn){
  let ok = false;
  try{ await navigator.clipboard.writeText(text); ok = true; }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;left:-9999px';
    document.body.appendChild(ta); ta.select();
    try{ ok = document.execCommand('copy'); }catch(e2){}
    ta.remove();
  }
  btn.textContent = ok ? '복사됐어요' : '길게 눌러 복사';
  btn.classList.toggle('ok', ok);
  setTimeout(() => { btn.textContent = '프롬프트 복사'; btn.classList.remove('ok'); }, 1500);
}

function refresh(){
  const n = ALL.filter(a => done.has(a.id)).length;
  document.getElementById('pn').textContent = `${n} / ${ALL.length}`;
  document.getElementById('pb').style.width = (n / ALL.length * 100) + '%';
  document.getElementById('pt').textContent =
    n === ALL.length ? '끝났습니다' : n ? `${ALL.length - n}개 남음` : '';
  for(const a of ALL){
    const c = document.getElementById('c_' + a.id);
    if(!c) continue;
    const on = done.has(a.id);
    c.classList.toggle('done', on);
    const b = c.querySelector('button.chk');
    if(b){ b.setAttribute('aria-pressed', on); b.textContent = '✓'; }
  }
}
async function toggle(id){
  done.has(id) ? done.delete(id) : done.add(id);
  refresh();
  try{ localStorage.setItem('goldaxe_assets', JSON.stringify([...done])); }catch(e){}
  if(db){ try{ await db.doc('assets/progress').set({ done: [...done] }); }catch(e){} }
}

const list = document.getElementById('list');
let num = 0;
for(const g of G){
  const sec = document.createElement('section');
  sec.style.cssText = 'display:flex;flex-direction:column;gap:10px';
  sec.innerHTML = `<div class="shead">${g.title}</div>`;
  for(const a of g.items){
    if(!a.nonum) num++;
    const c = document.createElement('div');
    c.className = 'card' + (g.kind === 'ing' ? ' ing' : '');
    c.id = 'c_' + a.id;
    c.innerHTML = `
      <div class="top">
        ${a.fixed ? `<span class="chk static" aria-hidden="true">✓</span>`
                  : `<button class="chk" aria-pressed="false" aria-label="${a.name}"></button>`}
        <div class="meta">
          <span class="name">${a.nonum ? '' : num + '. '}${a.name}</span>
          <span class="desc">${a.desc}</span>
          <span class="tags">${a.tags.map(([k,t]) => `<span class="tag ${k}">${t}</span>`).join('')}</span>
        </div>
      </div>
      <div class="acts">
        <button class="btn pri js-copy">프롬프트 복사</button>
        <button class="btn js-show">보기</button>
      </div>
      ${a.qc ? `<ul class="qc">${a.qc.map(t => `<li>${t}</li>`).join('')}</ul>` : ''}
      <pre hidden></pre>`;
    const b = c.querySelector('button.chk');
    if(b) b.onclick = () => toggle(a.id);
    c.querySelector('.js-copy').onclick = e => copy(a.p, e.currentTarget);
    const pre = c.querySelector('pre'); pre.textContent = a.p;
    c.querySelector('.js-show').onclick = e => {
      pre.hidden = !pre.hidden;
      e.currentTarget.textContent = pre.hidden ? '보기' : '접기';
    };
    sec.appendChild(c);
  }
  list.appendChild(sec);
}

try{ done = new Set(JSON.parse(localStorage.getItem('goldaxe_assets') || '[]')); }catch(e){}
refresh();

(async () => {
  const s = document.getElementById('sync');
  try{ db = await window.claude?.use?.('db') ?? null; }catch(e){}
  if(!db){ s.textContent = '이 기기에만'; return; }
  db.doc('assets/progress').onSnapshot(snap => {
    const arr = (snap.exists && snap.data()?.done) || [];
    done = new Set([...done, ...arr]); refresh(); s.textContent = '☁ 저장됨';
  }, () => { s.textContent = '이 기기에만'; });
})();
</script>
